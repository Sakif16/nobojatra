# Secret scanning — catches credentials before they reach a shared branch.
#
# Added in response to CODEBASE_GAP_ANALYSIS.md P0-1: a live TomTom key was
# committed in 2f57aca and pushed to three remote refs before anyone noticed.
#
# This scans only the commits introduced by a push or pull request, not the
# full history. That is deliberate: the historical leak in 2f57aca is still
# present in every ref until history is rewritten, so a full-history scan
# would fail on every run and be muted within a week. Scoped this way the
# check is green today and fails the moment a *new* secret is added.
#
# To audit the whole history manually (expect the known 2f57aca hit until it
# is rewritten):
#   docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
#     detect --source /repo --redact --verbose

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history on both sides of the range to diff against.
          fetch-depth: 0

      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "opts=--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch with no previous ref — scan its most recent commit.
            echo "opts=--log-opts=-1" >> "$GITHUB_OUTPUT"
          else
            echo "opts=--log-opts=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose --no-banner \
            "${{ steps.range.outputs.opts }}"
